        function moduleElement(db, name, static) {
            const div = document.createElement("div");
            if (static) {
                div.classList.add("module_static")
            }
            else {
                div.classList.add("module");
            }
            div.innerText = name;
            div.onclick = (e => {
                const result = db.exec(`
                    SELECT module, static
                    FROM module_requires
                    WHERE (module_id IN (SELECT id FROM module WHERE name=?))
                    ORDER BY module DESC `, [name]);

                document.getElementById("names").replaceChildren()


                for (const row of result) {
                    for (const value of row.values) {
                        console.info(value)
                        document.getElementById("names")
                            .appendChild(moduleElement(db, value[0], value[1] === 1))

                    }
                }

            })
            return div
        }
